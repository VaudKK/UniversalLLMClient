[project]
name = "universal-llm-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VaudKK", email = "vaudkeith@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pytest-asyncio>=1.4.1.post1",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
